<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="AdCheck 루테인 테스트 상품" />
    <title>AdCheck 테스트 상품페이지</title>
    <style>
      body { max-width: 760px; margin: 48px auto; padding: 0 24px; font-family: sans-serif; line-height: 1.7; }
      article { padding: 28px; border: 1px solid #ddd; border-radius: 16px; }
      img { width: 100%; max-width: 420px; border-radius: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="product-name">데일리 눈 건강 루테인</h1>
      <article class="product-description">
        <p>눈 건강에 도움을 줄 수 있습니다.</p>
        <p>시력을 회복하고 노안을 예방합니다.</p>
        <strong>100% 완벽한 효과를 약속합니다.</strong>
        <img src="./sample-product.svg" alt="루테인 건강기능식품 상품 이미지" />
      </article>
    </main>
  </body>
</html>
