spring:
  datasource:
    url: jdbc:h2:mem:adcheck;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

adcheck:
  analysis:
    async:
      core-pool-size: 1
      max-pool-size: 1
      queue-capacity: 20
      thread-name-prefix: analysis-test-
