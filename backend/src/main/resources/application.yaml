spring:
  application:
    name: adcheck-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adcheck}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
  web:
    error:
      include-stacktrace: never
      include-exception: false
      include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

adcheck:
  ocr:
    # auto | gemini | google-vision
    #   auto          : Vision 우선, 키가 없거나 호출이 실패한 이미지만 Gemini로 폴백(기본값)
    #   gemini        : Vision을 쓰지 않음
    #   google-vision : Vision만 쓰고 폴백하지 않음(비교 실험용)
    # Vision을 우선하는 근거는 FallbackOcrService 주석 참고(147장 실측).
    provider: ${OCR_PROVIDER:auto}
  analysis:
    pipeline-version: v1
    reuse-ttl-clean: 30d
    reuse-ttl-with-finding: 7d
    async:
      core-pool-size: ${ANALYSIS_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${ANALYSIS_ASYNC_MAX_POOL_SIZE:4}
      queue-capacity: ${ANALYSIS_ASYNC_QUEUE_CAPACITY:20}
      thread-name-prefix: analysis-

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

google:
  vision:
    # adcheck.ocr.provider=google-vision 일 때만 쓰인다.
    api-key: ${GOOGLE_VISION_API_KEY:}